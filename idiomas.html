<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AFL AUTOS — Idioma</title><style>body{margin:0;background:#101418;color:#f4f7f8;font:15px system-ui}.w{max-width:760px;margin:auto;padding:16px}.c{background:#171d22;border:1px solid #2b363d;border-radius:14px;padding:14px;margin-bottom:12px}textarea,select,button{width:100%;box-sizing:border-box;background:#0e1317;color:#f4f7f8;border:1px solid #2b363d;border-radius:9px;padding:10px;margin-top:8px;font:inherit}textarea{min-height:100px}.o{white-space:pre-wrap;background:#0c1115;border:1px dashed #46535b;border-radius:9px;padding:12px;margin-top:10px;min-height:70px}.p{background:#e3b84d;color:#17120a;font-weight:800}.m{color:#9fb0ba}.r{direction:rtl;text-align:right}</style></head><body><main class="w"><section class="c"><h1>Idioma / CTA V1</h1><p class="m">Detecta ES, EN o AR y genera solo el llamado a WhatsApp/visita. La respuesta comercial base sigue viniendo de Respuestas Rápidas.</p></section><section class="c"><textarea id="q" placeholder="Pega el mensaje del prospecto"></textarea><select id="l"><option value="AUTO">AUTO</option><option value="ES">ES</option><option value="EN">EN</option><option value="AR">AR</option></select><button class="p" id="d">DETECTAR + GENERAR CTA</button><div id="s" class="m"></div><div id="o" class="o"></div><button id="c">COPIAR CTA</button><button onclick="location.href='respuestas.html'">VOLVER A RESPUESTAS RÁPIDAS</button></section></main><script>const $=x=>document.getElementById(x);function ar(){const b=atob('2YfZhCDYqtix2LrYqCDZgdmKINmF2KrYp9io2LnYqSDYp9mE2YXYrdin2K/Yq9ipINi52KjYsSDZiNin2KrYs9in2Kgg2K3YqtmJINmG2LHYs9mEINmE2YMg2YXYstmK2K/Zi9inINmF2YYg2KfZhNmF2LnZhNmI2YXYp9iqINmI2KfZhNi12YjYsSDZiNmG2LHYqtioINmE2YMg2LLZitin2LHYqdif');return new TextDecoder().decode(Uint8Array.from(b,c=>c.charCodeAt(0)))}function dl(){if($('l').value!=='AUTO')return $('l').value;const q=$('q').value;if(/[\u0600-\u06ff]/.test(q))return'AR';const u=q.toLowerCase(),en=['price','how much','available','hello','where','finance','photos','visit','whatsapp'].filter(x=>u.includes(x)).length;return en?'EN':'ES'}function cta(l){if(l==='EN')return'Would you like to continue on WhatsApp so we can send you more information and photos, and arrange a visit?';if(l==='AR')return ar();return'¿Quieres continuar por WhatsApp para enviarte más información y fotos, y coordinar una visita?'}function run(){const l=dl(),t=cta(l);$('s').textContent='IDIOMA_DETECTADO: '+l;$('o').textContent=t;$('o').classList.toggle('r',l==='AR')}$('d').onclick=run;$('c').onclick=async()=>{if(!$('o').textContent)return;try{await navigator.clipboard.writeText($('o').textContent)}catch(e){}};run();</script></body></html>
