<!doctype html><html lang="es-MX"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AFL AUTOS — Respuestas Rápidas V1.3</title><style>html,body{margin:0;background:#101418;color:#f4f7f8;font:15px system-ui}.bar{max-width:900px;margin:auto;padding:14px}.card{background:#171d22;border:1px solid #594a76;border-radius:14px;padding:14px}.row{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:end}label{display:block;color:#c0b2db;font-size:12px;margin-bottom:4px}input,button{box-sizing:border-box;background:#0e1317;color:#f4f7f8;border:1px solid #2b363d;border-radius:9px;padding:10px;font:inherit}input{width:100%}button{cursor:pointer}.note{color:#aeb9c0;font-size:12px;margin-top:8px}iframe{display:block;width:100%;height:calc(100vh - 175px);border:0;background:#101418}@media(max-width:700px){.row{grid-template-columns:1fr}}</style></head><body><div class="bar"><div class="card"><div class="row"><div><label for="wa">Número de WhatsApp del prospecto — PRIVADO / SOLO SESIÓN</label><input id="wa" type="tel" inputmode="tel" autocomplete="off" placeholder="+52 ..."></div><button id="copy" type="button">COPIAR NÚMERO</button></div><div class="note">Este campo no se guarda en GitHub ni en localStorage. Para registro durable usa la base privada autorizada. La herramienta inferior conserva únicamente eventos sanitizados.</div></div></div><iframe src="respuestas-public-v13.html" title="AFL AUTOS — Respuestas Rápidas"></iframe><script>document.getElementById('copy').onclick=async()=>{const i=document.getElementById('wa');if(!i.value.trim())return;try{await navigator.clipboard.writeText(i.value.trim())}catch(e){i.select();document.execCommand('copy')}};</script></body></html>
